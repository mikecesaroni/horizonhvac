[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/plans"
  to = "/deals"
  status = 301

# /services/maintenance was a service page with no pricing on it. Its content is
# now consolidated into /maintenance-plans, which is reachable from the top menu.
# 301 rather than a meta-refresh so any existing links and search rankings carry over.
[[redirects]]
  from = "/services/maintenance"
  to = "/maintenance-plans"
  status = 301

# Specials retired. /deals and /tune-up are gone; redirect rather than 404 for
# anyone holding an old link, an ad, or a printed flyer.
[[redirects]]
  from = "/deals"
  to = "/"
  status = 301

[[redirects]]
  from = "/tune-up"
  to = "/maintenance-plans"
  status = 301
